name: Rename BlogApp to AVICRM

on:
  workflow_dispatch:
  push:
    branches: [rename-avicrm]

permissions:
  contents: write

concurrency:
  group: rename-avicrm
  cancel-in-progress: false

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-avicrm
          fetch-depth: 0

      - name: Skip if already done
        id: check
        run: |
          if [ -d AVICRM ] && [ ! -d BlogApp ] && [ -f AVICRM/AVICRM.csproj ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Content replace BlogApp → AVICRM
        if: steps.check.outputs.already != 'true'
        run: |
          set -euo pipefail
          find . -type f \
            \( -name '*.cs' -o -name '*.cshtml' -o -name '*.csproj' -o -name '*.sln' \
               -o -name 'Dockerfile' -o -name '*.yml' -o -name '*.yaml' -o -name '*.md' \
               -o -name '*.json' -o -name '*.example' -o -name '.gitignore' -o -name '.dockerignore' \
               -o -name '*.js' -o -name '*.css' -o -name '*.sh' \) \
            ! -path './.git/*' ! -path '*/bin/*' ! -path '*/obj/*' ! -path './.github/workflows/*' \
            -print0 | while IFS= read -r -d '' f; do
            if grep -q 'BlogApp' "$f" 2>/dev/null; then
              sed -i 's/BlogApp/AVICRM/g' "$f"
            fi
          done

      - name: Rename folder and project files
        if: steps.check.outputs.already != 'true'
        run: |
          set -euo pipefail
          if [ -d BlogApp ]; then
            if [ -f BlogApp/BlogApp.csproj ]; then
              git mv BlogApp/BlogApp.csproj BlogApp/AVICRM.csproj || mv BlogApp/BlogApp.csproj BlogApp/AVICRM.csproj
            fi
            # if sed already rewrote filename in index only, handle physical name
            if [ -f BlogApp/BlogApp.csproj ]; then mv BlogApp/BlogApp.csproj BlogApp/AVICRM.csproj; fi
            if [ -d AVICRM ]; then
              # merge: move remaining files
              cp -a BlogApp/. AVICRM/
              rm -rf BlogApp
            else
              git mv BlogApp AVICRM || mv BlogApp AVICRM
            fi
          fi
          if [ -f BlogApp.sln ]; then
            git mv BlogApp.sln AVICRM.sln || mv BlogApp.sln AVICRM.sln
          fi
          if [ -f AVICRM/AVICRM.csproj ]; then
            if ! grep -q '<AssemblyName>' AVICRM/AVICRM.csproj; then
              sed -i 's/<RootNamespace>AVICRM<\/RootNamespace>/<RootNamespace>AVICRM<\/RootNamespace>\n    <AssemblyName>AVICRM<\/AssemblyName>/' AVICRM/AVICRM.csproj
            fi
            sed -i 's/Dark Pro Blog/AVICRM/g' AVICRM/AVICRM.csproj || true
          fi
          sed -i 's/Dark Pro Blog/AVICRM/g' Dockerfile docker-compose.yml 2>/dev/null || true
          echo "Tree:"
          ls -la
          test -d AVICRM
          test -f AVICRM/AVICRM.csproj
          # no BlogApp left
          if [ -d BlogApp ]; then echo "BlogApp still exists" >&2; exit 1; fi

      - name: Commit
        if: steps.check.outputs.already != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "refactor: rename BlogApp to AVICRM (folder, csproj, namespaces)"
          git push origin HEAD:rename-avicrm
