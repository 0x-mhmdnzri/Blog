# =============================================================================
# Dark Pro Blog — Docker Compose
#
#   cp .env.example .env   # REQUIRED — all config lives in .env
#   # edit Admin__Password, Seo__BaseUrl, …
#   docker compose up --build -d
#   open http://localhost:${BLOG_HTTP_PORT}
#   public site: https://mhmdnzr.drl.ink
#
# Host ports (defaults in .env.example — change if busy):
#   blog        ${BLOG_HTTP_PORT:-8934}  → 8934
#   redis       ${REDIS_PORT:-16379}     → 6379
#   rabbitmq    ${RABBITMQ_PORT:-25672}  → 5672
#   rabbit mgmt ${RABBITMQ_MGMT_PORT:-35672} → 15672
# =============================================================================

name: dark-pro-blog

services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOTNET_VERSION: "${DOTNET_VERSION:-10.0}"
    image: ${IMAGE_NAME:-dark-pro-blog}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-dark-pro-blog}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BLOG_HTTP_PORT:-8934}:8934"
    volumes:
      - blog_data:/app/data
      - blog_logs:/app/logs
    networks:
      - blog_net
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "${BLOG_CPU_LIMIT:-1.0}"
          memory: ${BLOG_MEMORY_LIMIT:-512M}
        reservations:
          cpus: "${BLOG_CPU_RESERVE:-0.10}"
          memory: ${BLOG_MEMORY_RESERVE:-128M}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        labels: "service=blog,app=dark-pro-blog"
    # Image has no curl — TCP open on listen port is enough for container health.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8934"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER:-dark-pro-redis}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # Non-default host port avoids clash with system Redis on 6379
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - blog_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ${RABBITMQ_CONTAINER:-dark-pro-rabbitmq}
    restart: unless-stopped
    profiles: ["rabbitmq"]
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-blog}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-blog_change_me}
    ports:
      - "${RABBITMQ_PORT:-25672}:5672"
      - "${RABBITMQ_MGMT_PORT:-35672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - blog_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  blog_data:
    name: ${VOLUME_DATA_NAME:-dark-pro-blog-data}
  blog_logs:
    name: ${VOLUME_LOGS_NAME:-dark-pro-blog-logs}
  redis_data:
    name: ${VOLUME_REDIS_NAME:-dark-pro-redis-data}
  rabbitmq_data:
    name: ${VOLUME_RABBIT_NAME:-dark-pro-rabbitmq-data}

networks:
  blog_net:
    name: ${NETWORK_NAME:-dark-pro-blog-net}
    driver: bridge
