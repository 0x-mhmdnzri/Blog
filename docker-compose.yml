# =============================================================================
# Dark Pro Blog — production-oriented Compose
# Copy .env.example → .env and edit secrets before first up.
# All runtime config comes from .env (no passwords hardcoded here).
# =============================================================================

name: dark-pro-blog

services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOTNET_VERSION: "10.0"
    image: ${IMAGE_NAME:-dark-pro-blog}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-dark-pro-blog}
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    ports:
      - "${BLOG_HTTP_PORT:-8080}:8080"
    volumes:
      # SQLite + media bytes (entire CMS state)
      - blog_data:/app/data
      # Serilog rolling JSON (Filebeat / fluent-bit)
      - blog_logs:/app/logs
    networks:
      - blog_net
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "${BLOG_CPU_LIMIT:-1.0}"
          memory: ${BLOG_MEMORY_LIMIT:-512M}
        reservations:
          cpus: "${BLOG_CPU_RESERVE:-0.10}"
          memory: ${BLOG_MEMORY_RESERVE:-128M}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        labels: "service=blog,app=dark-pro-blog"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  blog_data:
    name: ${VOLUME_DATA_NAME:-dark-pro-blog-data}
  blog_logs:
    name: ${VOLUME_LOGS_NAME:-dark-pro-blog-logs}

networks:
  blog_net:
    name: ${NETWORK_NAME:-dark-pro-blog-net}
    driver: bridge
