# =============================================================================
# Dark Pro Blog — Docker Compose
#
#   cp .env.example .env   # REQUIRED — all config lives in .env
#   # edit Admin__Password, Seo__BaseUrl, …
#   docker compose up --build -d
#   open http://localhost:${BLOG_HTTP_PORT}
#
# Compose only interpolates infrastructure vars (${BLOG_HTTP_PORT}, image names,
# resource limits). Application settings are injected via env_file → container
# environment (ASP.NET Core env vars map to appsettings with __ nesting).
#
# Redis starts with the stack (distributed cache / output-cache backplane keys).
# RabbitMQ is opt-in:
#   docker compose --profile rabbitmq up -d
#   set RabbitMq__HostName=rabbitmq in .env, then: docker compose up -d blog
# =============================================================================

name: dark-pro-blog

services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOTNET_VERSION: "${DOTNET_VERSION}"
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BLOG_HTTP_PORT}:8934"
    volumes:
      # SQLite + /app/data/backups (scheduled full snapshots live on this volume)
      - blog_data:/app/data
      - blog_logs:/app/logs
    networks:
      - blog_net
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "${BLOG_CPU_LIMIT}"
          memory: ${BLOG_MEMORY_LIMIT}
        reservations:
          cpus: "${BLOG_CPU_RESERVE}"
          memory: ${BLOG_MEMORY_RESERVE}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        labels: "service=blog,app=dark-pro-blog"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8934/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER:-dark-pro-redis}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - blog_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ${RABBITMQ_CONTAINER}
    restart: unless-stopped
    profiles: ["rabbitmq"]
    env_file:
      - .env
    environment:
      # Official image only accepts these specific names (not RabbitMq__*)
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - blog_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  blog_data:
    name: ${VOLUME_DATA_NAME}
  blog_logs:
    name: ${VOLUME_LOGS_NAME}
  redis_data:
    name: ${VOLUME_REDIS_NAME:-dark-pro-redis-data}
  rabbitmq_data:
    name: ${VOLUME_RABBIT_NAME}

networks:
  blog_net:
    name: ${NETWORK_NAME}
    driver: bridge
